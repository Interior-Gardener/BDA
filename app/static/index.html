<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopSense Analytics</title>
  <meta name="description" content="E-Commerce Sales & Customer Behaviour Analytics — Spark + MongoDB + Machine Learning">
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    try { const t = localStorage.getItem('ss-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/overview">
      <img src="/static/img/logo.svg" alt="" width="36" height="36">
      <div>
        <div class="brand-name">ShopSense</div>
        <div class="brand-sub">Big Data Analytics</div>
      </div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="stack-pills">
        <span class="pill"><i class="dot spark"></i>Spark</span>
        <span class="pill"><i class="dot mongo"></i>MongoDB</span>
        <span class="pill"><i class="dot ml"></i>MLlib</span>
      </div>
      <div class="asof" id="asof">Loading…</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="page-head">
        <h1 id="pageTitle">Overview</h1>
        <p id="pageSub"></p>
      </div>
      <div class="search" id="globalSearch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" placeholder="Search customers by name or ID…" autocomplete="off">
        <kbd>/</kbd>
        <div class="search-results" id="searchResults"></div>
      </div>
      <a class="icon-btn" href="/docs" target="_blank" title="REST API docs (Swagger)">
        <svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg>
      </a>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark theme">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="modal-backdrop" id="modal"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/pages.js"></script>
<script src="/static/js/pages-ml.js"></script>
<script>boot();</script>
</body>
</html>
